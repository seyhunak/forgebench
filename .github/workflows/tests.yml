name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts examples
      - name: Format check
        run: ruff format --check src tests scripts examples
      - name: Test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openai/gpt-4o-mini
        run: pytest
      - name: Datasets and tasks must be reproducible
        run: make check-data
      - name: End-to-end demo
        # ``secrets`` cannot be read in an ``if:`` expression, so the guard
        # lives in the step body: no secret -> skip, never fail.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openai/gpt-4o-mini
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY secret is not set; skipping the end-to-end demo."
            exit 0
          fi
          forgebench run --config configs/baseline.yaml --run-id ci-baseline
          forgebench run --config configs/experiments/prompt_v1.yaml --run-id ci-prompt
          forgebench compare runs/ci-baseline runs/ci-prompt
