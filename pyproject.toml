[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forgebench"
version = "0.1.0"
description = "A small, reproducible benchmark for measuring whether model customization improves domain-specific AI performance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ForgeBench contributors" }]
keywords = ["llm", "evaluation", "benchmark", "mistral", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.6,<3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "mistralai>=1.0",
  "bleach>=6.0",
  # Markdown rendering of run reports (api.py: markdown-it + GFM tables).
  # mdit-py-plugins has no 1.x releases — it was pinned to an impossible
  # version, which made every fresh install fail dependency resolution.
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
ui = [
  "streamlit>=1.40",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "openai>=1.0",
  "anthropic>=0.30",
  "google-generativeai>=0.5",
]

[project.scripts]
forgebench = "forgebench.cli:app"

[project.urls]
Homepage = "https://github.com/your-org/forgebench"
Issues = "https://github.com/your-org/forgebench/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer's documented CLI pattern puts Option/Argument calls in defaults.
"src/forgebench/cli.py" = ["B008"]
